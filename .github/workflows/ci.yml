name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Regular PR/push CI intentionally stays Linux-only. Windows is already covered
# by local development builds, and macOS/Windows release verification remains
# in .github/workflows/release.yml.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings -D clippy::pedantic

      - name: test
        run: cargo test --all-targets

      - name: audit
        run: |
          cargo install cargo-audit --locked
          # Two advisories suppressed — see audit.toml for rationale and upgrade tracking.
          # RUSTSEC-2026-0041: lz4_flex 0.10.0 (transitive: cozo → swapvec 0.3.0 → lz4_flex ^0.10)
          # RUSTSEC-2026-0008: git2 0.19.0 (direct dependency; upgrade when git2 0.20 releases)
          cargo audit \
            --ignore RUSTSEC-2026-0041 \
            --ignore RUSTSEC-2026-0008
