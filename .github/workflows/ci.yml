name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Regular PR/push CI intentionally stays Linux-only. Windows is already covered
# by local development builds, and macOS/Windows release verification remains
# in .github/workflows/release.yml.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings -D clippy::pedantic

      - name: test
        run: cargo test --all-targets

      - name: audit
        run: |
          # Pin to the cargo-audit 0.22 line so the audit gate stays reproducible and
          # aligned with the 0.22-specific behavior documented in audit.toml.
          cargo install cargo-audit --version "^0.22" --locked
          # Advisory allowlist — see audit.toml for full rationale and review dates.
          # --deny warnings makes the --ignore set an explicit allowlist: any NEW
          # unmaintained/unsound advisory not listed below fails CI and forces re-triage.
          #
          # Vulnerability (owned by task 013.008-T):
          #   RUSTSEC-2026-0041: lz4_flex 0.10.0 (cozo → swapvec 0.3.0 → lz4_flex ^0.10)
          # Unmaintained-crate advisories (informational; Review: 2026-09-18):
          #   RUSTSEC-2025-0056: adler         (cozo → swapvec → miniz_oxide → adler)
          #   RUSTSEC-2025-0141: bincode 1.x   (cozo → swapvec/fast2s → bincode)
          #   RUSTSEC-2025-0057: fxhash        (cozo → jieba-rs → fxhash)
          #   RUSTSEC-2025-0119: number_prefix (indicatif 0.17 direct + hf-hub 0.3.2; upgrade infeasible per 035.001-T)
          #   RUSTSEC-2024-0436: paste         (tokenizers + candle/gemm → paste 1.x)
          cargo audit \
            --ignore RUSTSEC-2026-0041 \
            --ignore RUSTSEC-2025-0056 \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2025-0057 \
            --ignore RUSTSEC-2025-0119 \
            --ignore RUSTSEC-2024-0436 \
            --deny warnings
