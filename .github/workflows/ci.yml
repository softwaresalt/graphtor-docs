name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings -D clippy::pedantic

      - name: test
        run: cargo test --all-targets

      - name: audit
        run: |
          cargo install cargo-audit --locked
          # Ignore transitive-dep advisories that cannot be resolved without upstream fixes.
          # RUSTSEC-2026-0041: lz4_flex 0.10.0 (cozo → swapvec 0.3.0 → lz4_flex ^0.10; fix requires cozo to upgrade swapvec)
          # RUSTSEC-2026-0008: git2 0.19.0 (unsound Buf deref; tracked for upgrade when git2 0.20 stabilises)
          cargo audit \
            --ignore RUSTSEC-2026-0041 \
            --ignore RUSTSEC-2026-0008
