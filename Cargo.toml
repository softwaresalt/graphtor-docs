[workspace]
resolver = "2"

[package]
name = "graphtor-core"
version = "0.2.0"
edition = "2021"
description = "GraphRAG documentation index — core library and CLI"
license = "MIT"
rust-version = "1.75"
authors = ["graphtor-docs contributors"]
repository = "https://github.com/softwaresalt/graphtor-docs"
keywords = ["documentation", "rag", "graph", "mcp", "search"]
categories = ["development-tools", "text-processing"]

[lib]
name = "graphtor_core"
path = "src/lib.rs"

[[bin]]
name = "graphtor-docs"
path = "src/main.rs"

[dependencies]
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
globset = "0.4"
git2 = "0.19"
walkdir = "2"
pdf-extract = "0.10"
# Enable rayon for lopdf (pdf-extract's backend) to parallelize per-page object
# decompression.  Note: this does NOT help the serial xref index parsing
# (the bottleneck for very large PDFs — see pdfium dual backend for that).
# pdf-extract pins lopdf with default-features = false which disables rayon;
# adding the same version here with the rayon feature lets Cargo's
# feature-unification activate parallel decompression globally.
lopdf = { version = "0.38", default-features = false, features = ["rayon"] }
pulldown-cmark = "0.12"
cozo = { version = "0.7", default-features = false, features = ["storage-sqlite", "rayon"] }
sqlite = "0.32"
candle-core = { version = "0.8" }
candle-nn = { version = "0.8" }
candle-transformers = { version = "0.8" }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
hf-hub = { version = "0.3" }
rmcp = { version = "1.5", features = ["server", "transport-io"] }
# Minimal tokio feature set required by this crate:
# - rt-multi-thread: multi-threaded async runtime for #[tokio::main]
# - macros: #[tokio::main] and tokio::select! proc-macro support
# Transport I/O features (io-std, io-util) are activated transitively by rmcp.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
schemars = "1"
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.17"
ureq = "2"
htmd = "0.5"
scraper = "0.22"
texting_robots = "0.2"
docx-rs = "0.4"
url = "2"
# PDFium-based PDF backend for large files.  pdfium-render wraps the PDFium
# C library via dynamic loading (no native compile-time deps).  The DLL is
# located at runtime — when absent, the system falls back to pdf-extract.
pdfium-render = { version = "0.9", default-features = false, features = ["thread_safe", "pdfium_latest"] }

[dev-dependencies]
tempfile = "3"
git2 = "0.19"
candle-core = { version = "0.8" }

# When cross-compiling for x86_64-apple-darwin (from an ARM64 macOS runner),
# openssl-sys cannot find system x86_64 OpenSSL headers.  Force vendored mode
# so OpenSSL is compiled from source for that target only.  macOS ships Perl,
# which is required by the vendored build.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
