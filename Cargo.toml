[workspace]
resolver = "2"

[package]
name = "graphtor-core"
version = "0.3.0"
edition = "2021"
description = "GraphRAG documentation index — core library and CLI"
license = "MIT"
rust-version = "1.75"
authors = ["graphtor-docs contributors"]
repository = "https://github.com/softwaresalt/graphtor-docs"
keywords = ["documentation", "rag", "graph", "mcp", "search"]
categories = ["development-tools", "text-processing"]

[lib]
name = "graphtor_core"
path = "src/lib.rs"

[[bin]]
name = "graphtor-docs"
path = "src/main.rs"

[dependencies]
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
globset = "0.4"
walkdir = "2"
pulldown-cmark = "0.12"
cozo = { version = "0.7", default-features = false, features = ["storage-sqlite", "rayon"] }
sqlite = "0.32"
candle-core = { version = "0.8" }
candle-nn = { version = "0.8" }
candle-transformers = { version = "0.8" }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
hf-hub = { version = "0.3" }
rmcp = { version = "1.5", features = ["server", "transport-io"] }
# Minimal tokio feature set required by this crate:
# - rt-multi-thread: multi-threaded async runtime for #[tokio::main]
# - macros: #[tokio::main] and tokio::select! proc-macro support
# Transport I/O features (io-std, io-util) are activated transitively by rmcp.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
schemars = "1"
clap = { version = "4", features = ["derive", "env"] }
anstream = "1"
anstyle = "1"
indicatif = "0.17"
sysinfo = "0.30"

[dev-dependencies]
tempfile = "3"
candle-core = { version = "0.8" }
