        kind: command
        target: graphtor-docs sync
        command: cargo run --release -- sync
        url: null
        route: null
        expected_signal: Acquisition, chunking, embedding, and indexing complete for every configured source.
        required: false
        evidence_types:
        - stdout
        - exit-code
        - log-line
        notes: Expensive. Run when the change touches acquire/chunk/embed/db or the schema version.
      - id: mcp-stdio-handshake
        kind: command
        target: graphtor-docs serve (MCP STDIO)
        command: cargo run --release -- serve
        url: null
        route: null
        expected_signal: initialize response advertises the tool surface; server stays alive on STDIO.
        required: true
        evidence_types:
        - stdout
        - exit-code
        - log-line
        notes: 'Primary runtime surface. Regression-prone: see the serve/initialize handshake plan in docs/exec-plans/.'
      manual_checkpoints:
